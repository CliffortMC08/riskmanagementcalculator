<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Risk Calculator</title>
<style>
    :root {
        --bg: #0f0f11;
        --card: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #3b82f6;
        --green: #22c55e;
        --red: #ef4444;
        --input: #27272a;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    h1 {
        font-size: 1.35rem;
        font-weight: 700;
    }

    .theme-btn {
        background: var(--input);
        border: 1px solid var(--border);
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .section {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 22px 0 10px;
    }

    label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 13px 14px;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: 0.2s;
    }

    input:focus, select:focus {
        border-color: #52525b;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .direction {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 4px;
    }

    .dir-btn {
        padding: 13px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--muted);
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .dir-btn.active.buy {
        background: rgba(34, 197, 94, 0.15);
        border-color: var(--green);
        color: var(--green);
    }

    .dir-btn.active.sell {
        background: rgba(239, 68, 68, 0.15);
        border-color: var(--red);
        color: var(--red);
    }

    .calc-btn {
        width: 100%;
        margin-top: 18px;
        padding: 16px;
        background: white;
        color: #111;
        border: none;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .calc-btn:hover {
        opacity: 0.9;
    }

    /* Results */
    #results {
        display: none;
        margin-top: 28px;
        background: #141416;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .result-main {
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
    }

    .result-main .label {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 6px;
    }

    .result-main .value {
        font-size: 2rem;
        font-weight: 800;
    }

    .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .result-item {
        background: var(--card);
        padding: 14px 10px;
        border-radius: 12px;
        text-align: center;
    }

    .result-item .label {
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 4px;
    }

    .result-item .value {
        font-size: 1.15rem;
        font-weight: 700;
    }

    .green { color: var(--green); }
    .red { color: var(--red); }

    .info {
        margin-top: 16px;
        font-size: 0.85rem;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
    }

    .warning {
        color: var(--red);
        font-weight: 600;
        display: block;
        margin-top: 8px;
    }

    .specs {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Deriv Risk Calculator</h1>
        <button class="theme-btn" onclick="toggleTheme()">☀</button>
    </header>

    <!-- Instrument -->
    <div class="section">Instrument</div>
    <select id="instrument" onchange="showSpecs()">
        <option value="">Select instrument...</option>
        <optgroup label="Volatility Indices">
            <option value="v10">Volatility 10</option>
            <option value="v25">Volatility 25</option>
            <option value="v50">Volatility 50</option>
            <option value="v75">Volatility 75</option>
            <option value="v100">Volatility 100</option>
        </optgroup>
        <optgroup label="Volatility (1s)">
            <option value="v10_1s">Volatility 10 (1s)</option>
            <option value="v25_1s">Volatility 25 (1s)</option>
            <option value="v50_1s">Volatility 50 (1s)</option>
            <option value="v75_1s">Volatility 75 (1s)</option>
            <option value="v100_1s">Volatility 100 (1s)</option>
        </optgroup>
        <optgroup label="Crash & Boom">
            <option value="boom500">Boom 500</option>
            <option value="boom1000">Boom 1000</option>
            <option value="crash500">Crash 500</option>
            <option value="crash1000">Crash 1000</option>
        </optgroup>
        <optgroup label="Others">
            <option value="step">Step Index</option>
            <option value="jump10">Jump 10</option>
            <option value="jump25">Jump 25</option>
            <option value="jump50">Jump 50</option>
            <option value="jump100">Jump 100</option>
        </optgroup>
    </select>
    <div class="specs" id="specs"></div>

    <!-- Account -->
    <div class="section">Account</div>
    <div class="grid">
        <div>
            <label>Balance</label>
            <input type="number" id="balance" placeholder="1000" step="any">
        </div>
        <div>
            <label>Risk %</label>
            <input type="number" id="risk" placeholder="1.0" step="0.1">
        </div>
    </div>

    <!-- Trade -->
    <div class="section">Trade Setup</div>
    
    <label>Direction</label>
    <div class="direction">
        <button class="dir-btn buy active" onclick="setDirection('buy', this)">BUY</button>
        <button class="dir-btn sell" onclick="setDirection('sell', this)">SELL</button>
    </div>

    <label style="margin-top:14px;">Entry Price</label>
    <input type="number" id="entry" placeholder="Enter price" step="any">

    <div class="grid" style="margin-top:12px;">
        <div>
            <label>Stop Loss</label>
            <input type="number" id="sl" placeholder="SL price" step="any">
        </div>
        <div>
            <label>Take Profit</label>
            <input type="number" id="tp" placeholder="TP price" step="any">
        </div>
    </div>

    <button class="calc-btn" onclick="calculate()">Calculate Position Size</button>

    <!-- Results -->
    <div id="results">
        <div class="result-main">
            <div class="label">Recommended Lot Size</div>
            <div class="value" id="lotSize">0.000</div>
        </div>

        <div class="result-grid">
            <div class="result-item">
                <div class="label">Risk Amount</div>
                <div class="value red" id="riskAmount">$0.00</div>
            </div>
            <div class="result-item">
                <div class="label">Potential Profit</div>
                <div class="value green" id="profitAmount">$0.00</div>
            </div>
            <div class="result-item">
                <div class="label">SL Distance</div>
                <div class="value" id="slDistance">0 pts</div>
            </div>
            <div class="result-item">
                <div class="label">TP Distance</div>
                <div class="value" id="tpDistance">0 pts</div>
            </div>
        </div>

        <div class="result-item" style="margin-top:12px;">
            <div class="label">Risk : Reward</div>
            <div class="value" id="rr">1 : 0.00</div>
        </div>

        <div class="info" id="infoText"></div>
    </div>
</div>

<script>
    // Instrument data
    const instruments = {
        v10:      { min: 0.50,  step: 0.01,  pv: 1 },
        v25:      { min: 0.50,  step: 0.01,  pv: 1 },
        v50:      { min: 4.00,  step: 0.01,  pv: 1 },
        v75:      { min: 0.001, step: 0.001, pv: 1 },
        v100:     { min: 0.50,  step: 0.01,  pv: 1 },
        v10_1s:   { min: 0.20,  step: 0.01,  pv: 1 },
        v25_1s:   { min: 0.005, step: 0.001, pv: 1 },
        v50_1s:   { min: 0.005, step: 0.001, pv: 1 },
        v75_1s:   { min: 0.005, step: 0.001, pv: 1 },
        v100_1s:  { min: 0.10,  step: 0.01,  pv: 1 },
        boom500:  { min: 0.20,  step: 0.01,  pv: 1 },
        boom1000: { min: 0.20,  step: 0.01,  pv: 1 },
        crash500: { min: 0.20,  step: 0.01,  pv: 1 },
        crash1000:{ min: 0.20,  step: 0.01,  pv: 1 },
        step:     { min: 0.10,  step: 0.10,  pv: 10 },
        jump10:   { min: 0.01,  step: 0.01,  pv: 1 },
        jump25:   { min: 0.01,  step: 0.01,  pv: 1 },
        jump50:   { min: 0.01,  step: 0.01,  pv: 1 },
        jump100:  { min: 0.01,  step: 0.01,  pv: 1 }
    };

    let currentDirection = 'buy';

    function setDirection(dir, btn) {
        currentDirection = dir;
        document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function showSpecs() {
        const key = document.getElementById('instrument').value;
        const specsEl = document.getElementById('specs');
        
        if (!key || !instruments[key]) {
            specsEl.textContent = '';
            return;
        }
        
        const i = instruments[key];
        specsEl.textContent = `Min Lot: ${i.min}  •  Step: ${i.step}  •  ≈ $${i.pv}/point per 1 lot`;
    }

    function roundToStep(value, step) {
        const decimals = (step.toString().split('.')[1] || '').length;
        return Number((Math.floor((value / step) + 0.0000001) * step).toFixed(decimals));
    }

    function calculate() {
        const key = document.getElementById('instrument').value;
        const balance = parseFloat(document.getElementById('balance').value);
        const riskPercent = parseFloat(document.getElementById('risk').value);
        const entry = parseFloat(document.getElementById('entry').value);
        const sl = parseFloat(document.getElementById('sl').value);
        const tp = parseFloat(document.getElementById('tp').value);

        // Validation
        if (!key) {
            alert("Please select an instrument");
            return;
        }
        if (isNaN(balance) || balance <= 0) {
            alert("Please enter a valid account balance");
            return;
        }
        if (isNaN(riskPercent) || riskPercent <= 0) {
            alert("Please enter a valid risk percentage");
            return;
        }
        if (isNaN(entry)) {
            alert("Please enter Entry Price");
            return;
        }
        if (isNaN(sl)) {
            alert("Please enter Stop Loss Price");
            return;
        }
        if (isNaN(tp)) {
            alert("Please enter Take Profit Price");
            return;
        }

        const instr = instruments[key];
        const riskAmount = balance * (riskPercent / 100);
        const slDistance = Math.abs(entry - sl);
        const tpDistance = Math.abs(entry - tp);

        if (slDistance === 0) {
            alert("Stop Loss cannot be the same as Entry Price");
            return;
        }

        // Calculate lots
        let lots = riskAmount / (slDistance * instr.pv);
        lots = roundToStep(lots, instr.step);

        // Check minimum lot
        let warning = "";
        if (lots < instr.min) {
            lots = 0;
            warning = `Calculated size is below minimum lot (${instr.min}). Try higher risk % or tighter SL.`;
        }

        // Final values
        const actualRisk = lots * slDistance * instr.pv;
        const potentialProfit = lots * tpDistance * instr.pv;
        const riskReward = tpDistance / slDistance;

        // Display results
        document.getElementById('results').style.display = 'block';
        document.getElementById('lotSize').textContent = lots.toFixed(3);
        document.getElementById('riskAmount').textContent = '$' + actualRisk.toFixed(2);
        document.getElementById('profitAmount').textContent = '$' + potentialProfit.toFixed(2);
        document.getElementById('slDistance').textContent = slDistance.toFixed(2) + ' pts';
        document.getElementById('tpDistance').textContent = tpDistance.toFixed(2) + ' pts';
        document.getElementById('rr').textContent = '1 : ' + riskReward.toFixed(2);

        let info = `Target risk: $${riskAmount.toFixed(2)} (${riskPercent}% of balance)`;
        if (warning) {
            info += `<span class="warning">${warning}</span>`;
        }

        document.getElementById('infoText').innerHTML = info;
    }

    function toggleTheme() {
        // Simple theme toggle (you can expand later)
        alert("Theme toggle can be expanded. Currently dark mode only for maximum reliability.");
    }
</script>
</body>
</html>
