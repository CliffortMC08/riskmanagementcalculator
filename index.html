<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Single-Trade Risk Calculator</title>
    <style>
        :root {
            --bg-body: #0f0f0f;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: #2e2e2e;
            --input-bg: #262626;
            --radius: 12px;
            --buy: #22c55e;
            --sell: #ef4444;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-dim: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.25rem; font-weight: 800; }

        .theme-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 10px;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 13px 14px;
            font-size: 1rem;
            border-radius: var(--radius);
            outline: none;
        }

        input:focus, select:focus { border-color: #555; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .dir-switch { display: flex; gap: 10px; }

        .dir-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: var(--radius);
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.55;
            transition: 0.2s;
            user-select: none;
        }

        .dir-btn.buy.active {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--buy);
            color: var(--buy);
            opacity: 1;
        }

            background: rgba(239, 68, 68, 0.15);
            border-color: var(--sell);
            color: var(--sell);
