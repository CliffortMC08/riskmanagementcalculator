<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Synthetic Lot Size Calculator</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #fff;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .box {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 420px;
    }
    h1 {
        font-size: 1.3rem;
        margin: 0 0 20px 0;
        text-align: center;
    }
    label {
        display: block;
        font-size: 0.8rem;
        color: #aaa;
        margin: 14px 0 6px;
    }
    input, select {
        width: 100%;
        padding: 12px;
        background: #262626;
        border: 1px solid #444;
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        box-sizing: border-box;
    }
    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
    }
    #result {
        display: none;
        margin-top: 24px;
        background: #111;
        border-radius: 12px;
        padding: 18px;
        border: 1px solid #333;
    }
    .big {
        text-align: center;
        font-size: 2rem;
        font-weight: 800;
        margin: 10px 0;
    }
    .line {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 0.95rem;
    }
    .green { color: #22c55e; }
    .red { color: #ef4444; }
    .warning {
        color: #ef4444;
        font-weight: 600;
        margin-top: 12px;
        text-align: center;
    }
    .math {
        font-size: 0.8rem;
        color: #888;
        margin-top: 12px;
        line-height: 1.5;
        border-top: 1px solid #333;
        padding-top: 12px;
    }
</style>
</head>
<body>

<div class="box">
    <h1>Synthetic Lot Size Calculator</h1>

    <label>Instrument</label>
    <select id="instrument">
        <option value="v75">Volatility 75 (most popular)</option>
        <option value="v75_1s">Volatility 75 (1s)</option>
        <option value="v100">Volatility 100</option>
        <option value="v50">Volatility 50</option>
        <option value="v25">Volatility 25</option>
        <option value="v10">Volatility 10</option>
        <option value="boom500">Boom 500</option>
        <option value="boom1000">Boom 1000</option>
        <option value="crash500">Crash 500</option>
        <option value="crash1000">Crash 1000</option>
        <option value="step">Step Index</option>
    </select>

    <div class="row">
        <div>
            <label>Account Balance ($)</label>
            <input type="number" id="balance" value="1000" step="any">
        </div>
        <div>
            <label>Risk %</label>
            <input type="number" id="risk" value="1" step="0.1">
        </div>
    </div>

    <label>Entry Price</label>
    <input type="number" id="entry" placeholder="e.g. 50000" step="any">

    <label>Stop Loss Price</label>
    <input type="number" id="sl" placeholder="e.g. 49000" step="any">

    <label>Take Profit Price (optional)</label>
    <input type="number" id="tp" placeholder="e.g. 52000" step="any">

    <button onclick="calculate()">Calculate Lot Size</button>

    <div id="result">
        <div style="text-align:center; color:#aaa; font-size:0.85rem;">Recommended Lot Size</div>
        <div class="big" id="lots">0.00</div>

        <div class="line">
            <span>Risk Amount</span>
            <span class="red" id="riskMoney">$0.00</span>
        </div>
        <div class="line">
            <span>SL Distance</span>
            <span id="distance">0 points</span>
        </div>
        <div class="line">
            <span>Potential Profit</span>
            <span class="green" id="profit">$0.00</span>
        </div>
        <div class="line">
            <span>Risk : Reward</span>
            <span id="rr">—</span>
        </div>

        <div id="warning" class="warning"></div>

        <div class="math" id="math"></div>
    </div>
</div>

<script>
    // Point value for 1.0 lot
    const data = {
        v75:      { min: 0.001, step: 0.001, pv: 1 },
        v75_1s:   { min: 0.005, step: 0.001, pv: 1 },
        v100:     { min: 0.50,  step: 0.01,  pv: 1 },
        v50:      { min: 4.00,  step: 0.01,  pv: 1 },
        v25:      { min: 0.50,  step: 0.01,  pv: 1 },
        v10:      { min: 0.50,  step: 0.01,  pv: 1 },
        boom500:  { min: 0.20,  step: 0.01,  pv: 1 },
        boom1000: { min: 0.20,  step: 0.01,  pv: 1 },
        crash500: { min: 0.20,  step: 0.01,  pv: 1 },
        crash1000:{ min: 0.20,  step: 0.01,  pv: 1 },
        step:     { min: 0.10,  step: 0.10,  pv: 10 }
    };

    function calculate() {
        const key = document.getElementById('instrument').value;
        const balance = parseFloat(document.getElementById('balance').value);
        const riskPct = parseFloat(document.getElementById('risk').value);
        const entry = parseFloat(document.getElementById('entry').value);
        const sl = parseFloat(document.getElementById('sl').value);
        const tp = parseFloat(document.getElementById('tp').value);

        if (isNaN(balance) || isNaN(riskPct) || isNaN(entry) || isNaN(sl)) {
            alert("Please fill Balance, Risk %, Entry and Stop Loss");
            return;
        }

        const instr = data[key];
        const riskMoney = balance * (riskPct / 100);
        const distance = Math.abs(entry - sl);

        if (distance === 0) {
            alert("Stop Loss cannot be the same as Entry");
            return;
        }

        // THE CORE FORMULA
        let lots = riskMoney / (distance * instr.pv);

        // Round down to valid step
        lots = Math.floor(lots / instr.step) * instr.step;
        lots = Number(lots.toFixed(4));

        // Check minimum
        let warning = "";
        if (lots < instr.min) {
            warning = `Result is below minimum lot (${instr.min}). Increase risk % or use smaller SL distance.`;
            lots = 0;
        }

        // Profit calculation
        let profit = 0;
        let rrText = "—";
        if (!isNaN(tp)) {
            const tpDistance = Math.abs(entry - tp);
            profit = lots * tpDistance * instr.pv;
            rrText = "1 : " + (tpDistance / distance).toFixed(2);
        }

        // Show results
        document.getElementById('result').style.display = 'block';
        document.getElementById('lots').textContent = lots.toFixed(3);
        document.getElementById('riskMoney').textContent = "$" + (lots * distance * instr.pv).toFixed(2);
        document.getElementById('distance').textContent = distance.toFixed(1) + " points";
        document.getElementById('profit').textContent = "$" + profit.toFixed(2);
        document.getElementById('rr').textContent = rrText;
        document.getElementById('warning').textContent = warning;

        // Show the math so you can verify
        document.getElementById('math').innerHTML = `
            Risk Amount = $${balance} × ${riskPct}% = <b>$${riskMoney.toFixed(2)}</b><br>
            SL Distance = ${distance.toFixed(1)} points<br>
            Lot Size = $${riskMoney.toFixed(2)} ÷ (${distance.toFixed(1)} × $${instr.pv}) = <b>${(riskMoney / (distance * instr.pv)).toFixed(4)}</b>
        `;
    }
</script>
</body>
</html>
